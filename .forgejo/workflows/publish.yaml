name: Publish

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: codeberg-tiny-lazy
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Ruby environment
        uses: https://git.ryujinx.app/actions/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Build site
        run: JEKYLL_ENV=production bundle exec jekyll build
      - name: Publish site
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://elitalon.com/
          server: codeberg.page
          token: ${{ forge.token }}
          source: _site/
      - name: Publish site on www subdomain
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://www.elitalon.com/
          server: codeberg.page
          token: ${{ forge.token }}
          source: _site/
